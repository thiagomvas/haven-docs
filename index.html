<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Haven is a self-hosted application orchestration platform for small teams and solo developers." />
    <meta property="og:title" content="Haven" />
    <meta property="og:description" content="Self-hosted application orchestration for small teams and solo developers." />
    <meta name="twitter:card" content="summary" />
    <title>Haven – Self-hosted application orchestration</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('haven-theme');
          if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
